<!DOCTYPE html>
<html>
<head>
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <div class="logo">⬇️</div>

    <h1>TubeFlow</h1>

    <p class="subtitle">
        Download videos instantly with premium speed
        and crystal clear quality.
    </p>

    <input
        type="text"
        id="url"
        placeholder="Paste YouTube URL..."
    >

    <button onclick="downloadVideo()">
        Download Now
    </button>

    <div class="features">
        <div class="card">
            ⚡<br>
            Fast
        </div>

        <div class="card">
            🎬<br>
            HD
        </div>

        <div class="card">
            🔒<br>
            Secure
        </div>
    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
